[tool.poetry]
name = "world-builder-site"
version = "0.1.0"
description = "Backend and core engine for world-builder-site"
authors = ["Inbar Rose <inbar@example.com>"]
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = {extras=["standard"], version="^0.24.0"}
sqlmodel = "^0.0.14"
alembic = "^1.11"
pydantic = {extras=["email"], version="^2.3"}
httpx = "^0.25"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
coverage = "^7.0"
black = "^24.3"
ruff = "^0.12.0"
mypy = "^1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Supabase CLI Configuration
# This file configures the Supabase CLI for local development and migrations

[project]
# Your Supabase project reference ID (get from dashboard)
# This will be set when you run: supabase link --project-ref <your-project-ref>

[auth]
# Auth configuration
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[api]
# API configuration
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Database configuration
port = 54322
shadow_port = 54320
major_version = 15

[studio]
# Supabase Studio configuration
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
# Email testing (local development)
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# Storage configuration
enabled = true
file_size_limit = "52428800" # 50MB
file_size_limit_unit = "B"

[functions]
# Edge Functions (if you use them)
enabled = false


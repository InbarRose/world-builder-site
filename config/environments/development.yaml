---
# Development Environment Configuration
environment: development
debug: true
log_level: debug

# Database Configuration
database:
  url: "sqlite:///./dev.db"
  echo: true
  pool_size: 5
  max_overflow: 10

# API Configuration
api:
  title: "World Builder Site API (Dev)"
  version: "0.1.0"
  docs_url: "/docs"
  redoc_url: "/redoc"
  cors_origins: ["http://localhost:3000", "http://localhost:5173"]

# Authentication
auth:
  jwt_secret: "dev-secret-key-change-in-production"
  jwt_algorithm: "HS256"
  jwt_expiration_hours: 24
  password_min_length: 8

# Supabase Configuration (Development)
supabase:
  url: "${SUPABASE_URL}"
  service_role_key: "${SUPABASE_SERVICE_ROLE_KEY}"
  anon_key: "${SUPABASE_ANON_KEY}"

# Game Configuration
game:
  default_grid_width: 20
  default_grid_height: 12
  max_moves_per_session: 1000
  rules_version: "2025-01-27"

# Rate Limiting
rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst_limit: 100


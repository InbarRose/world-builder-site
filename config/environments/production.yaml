---
# Production Environment Configuration
environment: production
debug: false
log_level: info

# Database Configuration
database:
  url: "${DATABASE_URL}"
  echo: false
  pool_size: 20
  max_overflow: 30
  ssl_mode: require

# API Configuration
api:
  title: "World Builder Site API"
  version: "0.1.0"
  docs_url: null  # Disable docs in production
  redoc_url: null
  cors_origins: ["${FRONTEND_URL}"]

# Authentication
auth:
  jwt_secret: "${JWT_SECRET}"
  jwt_algorithm: "HS256"
  jwt_expiration_hours: 24
  password_min_length: 12

# Supabase Configuration (Production)
supabase:
  url: "${SUPABASE_URL}"
  service_role_key: "${SUPABASE_SERVICE_ROLE_KEY}"
  anon_key: "${SUPABASE_ANON_KEY}"

# Game Configuration
game:
  default_grid_width: 20
  default_grid_height: 12
  max_moves_per_session: 1000
  rules_version: "2025-01-27"

# Rate Limiting
rate_limiting:
  enabled: true
  requests_per_minute: 30
  burst_limit: 50

# Security
security:
  enable_csrf: true
  enable_cors: true
  trusted_hosts: ["${TRUSTED_HOSTS}"]

